# PointMaze-specific Slot-AC inference entry point. Model/environment details
# are restored from the selected training run's hydra.yaml.
defaults:
  - plan_base
  - _self_

ckpt_base_path: ${hydra:runtime.cwd}/../../artifacts/checkpoints/downstream/planar
model_name: Maze
model_epoch: latest
# Require the native-grid predictor used by newly trained checkpoints.
expected_model_input_size: 384
expected_slot_spatial_size: 24
expected_predictor_internal_spatial_size: 24
expected_object_branch_spatial_sizes: [24, 16, 12]
expected_mask_softmax_temperature: 1.0
expected_mask_sharpen_gamma: 2.0
expected_color_channel_weights_version: planar_important_objects_global_random_shapes_v2_block12_512px
hydra:
  run:
    dir: plan_outputs/Maze/${now:%Y%m%d_%H%M%S}
  sweep:
    dir: plan_outputs/Maze/${now:%Y%m%d_%H%M%S}
    subdir: ${hydra.job.num}
n_evals: 50
# eval_case_indices: [10,26,39,48,46,21,37,29]
goal_source: file
goal_file_path: ${hydra:runtime.cwd}/../../artifacts/data/planar/Maze/targets/test.pkl
rerender_file_targets: true
train_trajectory_budget_multiplier: null

planner:
  max_env_steps: 50
  normalized_action_clip: 2.0
  predictive_replan_within_block: false
  sub_planner:
    target: planning.cem.CEMPlanner
    horizon: 5
    # Match Maze generalization: optimize five coherent acceleration knots
    # and interpolate them across the 25 primitive environment actions.
    num_action_knots: 5
    topk: 10
    num_samples: 100
    var_scale: 2.0
    action_temporal_correlation: 0.6
    opt_steps: 10
    eval_every: 10


# Maze planning success is defined by the visual/position target.  Do not make
# CEM match the randomly sampled velocity components in the goal state.
objective:
  alpha: 0.0
  # Keep these equal to Wall while evaluating the same obstacle-aware UOT in
  # PointMaze. Tune per environment only after the initial comparison.
  obstacle_transport:
    enabled: true
    # Recompute model-global values after training the native-grid checkpoint.
    # Until then, null selects deterministic online probing instead of reusing
    # statistics from the obsolete 16x16 mask grid.
    motion_score_mode: per_frame_difference_topk
    motion_topk_patches: 10
    fixed_slot_change_scores: null
    moving_requires_both_scores: false
    all_non_moving_static: false
    moving_topk: 0
    static_bottomk: 0
    num_probe_actions: 16
    probe_action_std: 1.0
    probe_seed: 1729
    # Definite obstacle/background slots are below the low threshold; only
    # strongly changing object slots above the high threshold use geodesic
    # transport. Moderately changing complementary background slots are ignored.
    static_change_threshold: 0.05
    moving_change_threshold: 0.15
    local_change_fraction: 0.05
    hardening_temperature: 1.0
    # Compute the shortest path through a continuous obstacle-resistance field.
    # No patch is thresholded into a hard wall.
    cost_mode: geodesic
    # Traversing mask value o scales local distance by (1 + weight * o).
    penalty_weight: 20.0
    # Start without dilation: one 16x16 patch is already large relative to the
    # PointMaze ball and can close narrow passages. Increase only if needed.
    obstacle_dilation: 0
