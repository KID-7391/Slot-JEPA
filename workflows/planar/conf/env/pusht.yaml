name: pusht
args: []
kwargs: 
  with_velocity: true
  with_target: true
  render_size: 512
  # Evaluate object translation in the same geometry-centered coordinates as
  # the visual planning objective. This is also shared by PushObj.
  use_geometric_center_eval: true

dataset:
  _target_: "datasets.pusht_dset.load_pusht_slice_train_val"
  # Always replay states through the simulator; never use MP4 frames.
  render_from_state: true
  render_size: ${img_size}
  with_velocity: true
  n_rollout: null
  normalize_action: ${normalize_action}
  data_path: ${oc.env:DATASET_DIR,${hydra:runtime.cwd}/../../artifacts/data/planar/PushT}
  split_ratio: 0.9
  max_causal_windows_per_trajectory: 8
  transform:
    _target_: "datasets.img_transforms.default_transform"
    img_size: ${img_size}

decoder_path: null
num_workers: 16
