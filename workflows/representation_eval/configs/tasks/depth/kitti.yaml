experiment:
  name: kitti_slot-jepa_vitb16_linear_depth
  output_subdir: depth/kitti/slot-jepa_vitb16
  seed: 321

model:
  load_mode: direct_vit_checkpoint
  model_type: vjepa2_slot
  model_scale: vit_base
  ckpt_ref: slot_jepa/slot_jepa_droid_finetuned.pt
  patch_size: 16
  patch_stride: 16
  patch_padding: 0
  video_infer_frames: 2
  slot_alpha: 0.3
  slot_window_size: [2, 4]
  slot_slots_per_window: 4
  slot_global_k: 16
  slot_mask_temp: 0.05
  slot_l_max: 24
  slot_use_decoder_checkpoint: false
  state_dict_key: null
  prefix_filter: null
  strip_prefix: ""
  feature_source:
    mode: single
    single:
      source: get_embeddings
      index: -1

data:
  root_ref: kitti
  dataset: kitti
  splits:
    train: kitti_eigen_train.txt
    val: kitti_eigen_test.txt
    test: kitti_eigen_test.txt
  image_dir: input
  depth_dir: gt_depth

head:
  type: linear
  use_batchnorm: true
  n_output_channels: 256
  min_depth: 0.001
  max_depth: 80.0
  bins_strategy: linear
  norm_strategy: linear

train:
  global_batch_size: 16
  max_steps: 38400
  optimizer:
    type: adamw
    lr: 0.0003
    betas: [0.9, 0.99]
    weight_decay: 0.0001
  scheduler:
    type: warmup_onecycle
    warmup_iters: 12800
    final_div_factor: 1000.0
  amp:
    enabled: true
    dtype: float16

loss:
  sigloss: 1.0

eval:
  batch_size: 1
  metrics: [rmse, abs_rel, a1]
  min_depth: 0.001
  max_depth: 80.0
  ignored_value: 0.0
  use_tta: false
  eval_period_iterations: 1600

distributed:
  num_workers: 4
  persistent_workers: false

result:
  save_results: false
  save_format: png
