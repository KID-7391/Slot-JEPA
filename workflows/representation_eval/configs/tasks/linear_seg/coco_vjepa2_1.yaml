experiment:
  name: coco_vjepa2_1_vitb16_linear_seg
  seed: 0
  output_subdir: linear_seg/coco/vjepa2_1_vitb16

model:
  load_mode: direct_vit_checkpoint
  model_type: vjepa2
  model_scale: vit_base
  ckpt_ref: vjepa_2_1/vjepa2_1_vitb_dist_vitG_384.pt
  patch_size: 16
  patch_stride: 16
  patch_padding: 0
  video_infer_frames: 2
  state_dict_key: ema_encoder
  prefix_filter: null
  strip_prefix: ""
  feature_source:
    mode: single
    single:
      source: get_embeddings
      index: -1

data:
  root_ref: segmentation_root
  datasets: [coco]
  resolution:
    train: 336
    val: 448
  augmentation:
    train:
      - name: random_resized_crop
        size: [336, 336]
        scale: [0.8, 1.0]
      - name: random_horizontal_flip
        p: 0.5
      - name: normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
    val:
      - name: resize
        size: [448, 448]
      - name: normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]

head_search:
  heads: [linear]
  lrs: [0.0001, 0.0003, 0.0008, 0.001, 0.002, 0.003, 0.01]

train:
  max_steps: 2000
  global_batch_size: 256
  optimizer:
    type: adam
    weight_decay: 0.0
    betas: [0.9, 0.999]

distributed:
  num_workers: 4

eval:
  test_batch_size: 8
