[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slot-jepa"
version = "0.1.0"
description = "Object-structured joint-embedding predictive architecture"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy==1.26.4",
  "torch==2.2.2",
]

[project.urls]
Paper = "https://arxiv.org/abs/2610.28074"
Repository = "https://github.com/KID-7391/Slot-JEPA"

[tool.setuptools.packages.find]
where = ["src"]
include = ["slot_jepa*"]
namespaces = true
